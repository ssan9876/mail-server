# ============================================================================
# DKIM signing. Keys + selector map are exported from the database to the
# shared /dkim volume by the backend (dkim_export_service).
#   /dkim/<domain>/<selector>.key   private key (PKCS8 PEM)
#   /dkim/selectors.map             "<domain> <selector>" per line
# If a domain has no key yet, signing is simply skipped for it.
# ============================================================================
enabled = true;

# Sign mail from authenticated submission and from our own networks.
sign_authenticated = true;
sign_local = true;

# Derive the signing domain from the From: header (effective second-level).
use_domain = "header";
use_esld = true;

# --- Sender identity binding (security audit) -------------------------------
# !! VALIDATE IN STAGING alongside the Postfix half — see docs/deployment.md.
# !! Getting this wrong silently stops outbound SIGNING (mail still sends, just
# !! unsigned), which surfaces as DMARC failures at recipients rather than as
# !! an error here.
#
# `allow_hdrfrom_mismatch = false` requires the From: header to align with the
# envelope sender. This is the half Postfix cannot enforce: its
# `smtpd_sender_login_maps` binds the ENVELOPE sender to the authenticated
# login, but signing keys off the HEADER — so without this, a user could pass
# a legitimate envelope sender and still set `From:` to another hosted domain
# and have it signed with that domain's key. The two settings only close the
# hole together: envelope bound to login, header bound to envelope.
allow_hdrfrom_mismatch = false;

# Deliberately still TRUE. Setting it false would require the authenticated
# username to equal the From address, breaking the legitimate and common case
# of sending as one's own alias (login `jane@acme.com`, From `j.doe@acme.com`)
# — Rspamd would skip signing and the mail would leave unsigned. It is safe to
# leave permissive because the pair above already constrains From: to addresses
# this login owns: `virtual_alias_maps.cf` is part of
# `smtpd_sender_login_maps`, so an alias is usable only by the mailbox it
# actually points at.
allow_username_mismatch = true;

# Per-domain key lookup.
path = "/dkim/$domain/$selector.key";
selector_map = "/dkim/selectors.map";
# Fallback selector if a domain is missing from the map.
selector = "mail";
